
name = "stock-down-tracker"
main = "src/index.js"
compat_date = "2024-01-01"

# KV Namespace Binding
[[kv_namespaces]]
binding = "STOCK_CONFIG"
id = "YOUR_KV_ID_HERE"      # User will need to replace this
preview_id = "YOUR_KV_PREVIEW_ID"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "stock-tracker-db"
database_id = "YOUR_D1_ID_HERE"  # User will need to replace this
preview_database_id = "DB" # Use miniflare local DB for preview

[triggers]
crons = ["*/30 * * * 1-5"] # Every 30 mins, Mon-Fri

[vars]
API_KEY = "demo-key"
